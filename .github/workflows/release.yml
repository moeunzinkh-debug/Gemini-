name: Release patch bundle
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate scripts and repository layout
        run: scripts/check-repo.sh
      - name: Install pinned tools (SHA-256 verified)
        run: scripts/setup-tools.sh
      - name: Ensure Android API library for D8
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"'
      - name: Build and verify the Morphe bundle
        run: scripts/build-mpp.sh
      - name: Verify version-specific hook records
        run: scripts/check-hook-profiles.sh --write
      # Report compiler diagnostics through the annotations API too: the Actions log
      # hosts are not reachable from every environment.
      - name: Report build diagnostics
        if: always()
        run: |
          test -f build/compile.log || exit 0
          grep -E 'error:|exception:' build/compile.log | head -40 | while IFS= read -r line; do
            printf '::error::%s\n' "${line//%/%25}"
          done
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json; print(json.load(open("patches-bundle.json"))["version"])')"
          tag="v$version"
          # package-mpp.py asserts the download URL, so the tag must match the metadata version.
          if [ "${GITHUB_REF_TYPE:-}" = tag ]; then
            test "$GITHUB_REF_NAME" = "$tag" || {
              echo "Tag $GITHUB_REF_NAME does not match patches-bundle.json version $version" >&2
              exit 1
            }
          fi
          bundle="build/release/gemini-standalone-patches-$version.mpp"
          test -f "$bundle"
          test -f "docs/releases/$tag.md" || {
            echo "Missing release notes: docs/releases/$tag.md" >&2
            exit 1
          }
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Updating existing release $tag"
            gh release upload "$tag" \
              "$bundle" build/release/patches-bundle.json build/release/SHA256SUMS --clobber
          else
            gh release create "$tag" \
              --title "Gemini standalone patches $tag" \
              --notes-file "docs/releases/$tag.md" \
              "$bundle" build/release/patches-bundle.json build/release/SHA256SUMS
          fi
          echo "Published $bundle to $tag"
