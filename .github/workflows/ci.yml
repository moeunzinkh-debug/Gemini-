name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate scripts and repository layout
        run: scripts/check-repo.sh
      - name: Install pinned tools (SHA-256 verified)
        run: scripts/setup-tools.sh
      - name: Ensure Android API library for D8
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"'
      - name: Compile patches
        run: |
          set -o pipefail
          mkdir -p build
          scripts/compile-patches.sh 2>&1 | tee build/compile.log
      # Log downloads are not reachable from every environment, so surface the compiler
      # diagnostics through the check-run annotations API as well.
      - name: Report compiler diagnostics
        if: always()
        run: |
          test -f build/compile.log || exit 0
          grep -E 'error:|exception:|warning:' build/compile.log | head -40 | while IFS= read -r line; do
            printf '::error::%s\n' "${line//%/%25}"
          done
      - name: Build and verify the Morphe bundle
        run: scripts/build-mpp.sh
      - name: Verify version-specific hook records
        run: scripts/check-hook-profiles.sh --write
      - name: Compile APK verification tools
        run: |
          for source in scripts/kotlin/*.kt; do
            tools/kotlinc/bin/kotlinc "$source" -cp tools/morphe-desktop.jar:build/gemini-patches.jar -d "build/$(basename "$source" .kt).jar"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gemini-patches-${{ github.sha }}
          path: build/release/*
          if-no-files-found: error
          retention-days: 14
